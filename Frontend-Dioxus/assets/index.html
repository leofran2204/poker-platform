<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Project</title>
    <style>
        /* ============================================================
           Full Tilt Poker Visual Style — CSS Puro
           Classic early-2000s online poker aesthetic.
           Felt green, gold borders, solid colors, no transparency,
           no hover animations, amateur-friendly spacing.
           ============================================================ */

        /* --- Reset & Base --- */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a3a1a;  /* dark felt green */
            color: #e8e0d0;        /* warm off-white */
            min-height: 100vh;
        }

        /* ============================================================
           TABLE CARD
           ============================================================ */
        .table-card {
            display: block;
            background: #1e4a1e;           /* solid felt green */
            border: 2px solid #8b6914;     /* thick gold border */
            border-radius: 4px;            /* subtle corners */
            padding: 16px;
        }

        .table-card-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .table-card-icon {
            font-size: 24px;
            color: #d4a843;  /* gold */
        }

        .table-card-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }

        .table-card-info {
            font-size: 13px;
            color: #7ab87a;  /* lighter green */
            margin: 4px 0 0 0;
        }

        .table-card-right {
            text-align: right;
        }

        .table-card-count {
            font-size: 22px;
            font-weight: 700;
            color: #d4a843;  /* gold */
        }

        .table-card-occupancy {
            font-size: 11px;
            color: #7ab87a;
        }

        .table-card-full {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #cc4444;  /* red */
        }

        /* ============================================================
           LOBBY FILTERS
           ============================================================ */
        .lobby-filters {
            background: #1e4a1e;
            border: 2px solid #8b6914;
            border-radius: 4px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .lobby-filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .lobby-filters-field {
            display: flex;
            flex-direction: column;
        }

        .lobby-filters-label {
            font-size: 11px;
            color: #7ab87a;
            margin-bottom: 4px;
        }

        .lobby-filters-select {
            background: #1a3a1a;
            color: #ffffff;
            border: 2px solid #5a7a3a;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .lobby-filters-select:focus {
            outline: none;
            border-color: #d4a843;
        }

        .lobby-filters-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
        }

        .lobby-filters-checkbox-input {
            width: 16px;
            height: 16px;
            accent-color: #d4a843;
            cursor: pointer;
        }

        .lobby-filters-checkbox-label {
            font-size: 14px;
            color: #ffffff;
            cursor: pointer;
        }

        /* ============================================================
           JOIN BUTTON
           ============================================================ */
        .join-btn {
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            padding: 8px 22px;
            border-radius: 4px;
            border: 2px solid;
            cursor: pointer;
        }

        .join-btn-available {
            background: #2d7a2d;      /* solid green */
            border-color: #4a9a4a;
            color: #ffffff;
        }

        .join-btn-available:hover {
            background: #3a8a3a;
        }

        .join-btn-full {
            background: #3a3a3a;      /* dark gray */
            border-color: #555555;
            color: #888888;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .join-btn-spectating {
            background: #8b6914;      /* gold/brown */
            border-color: #a07a20;
            color: #ffffff;
        }

        .join-btn-spectating:hover {
            background: #9a7820;
        }

        /* ============================================================
           PLAYER COUNT
           ============================================================ */
        .player-count {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .player-count-numbers {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .player-count-current {
            font-size: 22px;
            font-weight: 700;
        }

        .player-count-separator {
            font-size: 13px;
            color: #7ab87a;
        }

        .player-count-max {
            font-size: 13px;
            color: #7ab87a;
        }

        .player-count-bar-track {
            width: 96px;
            height: 6px;              /* thicker bar */
            background: #3a3a3a;
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }

        .player-count-bar-fill {
            height: 100%;
            border-radius: 3px;
        }

        .player-count-label {
            font-size: 11px;
            color: #7ab87a;
            margin-top: 4px;
        }

        /* --- Player Count Colors --- */
        .player-count-text-empty  { color: #888888; }
        .player-count-text-low    { color: #4a9a4a; }
        .player-count-text-medium { color: #d4a843; }
        .player-count-text-high   { color: #cc8844; }
        .player-count-text-full   { color: #cc4444; }

        .player-count-bar-empty   { background: #555555; }
        .player-count-bar-low     { background: #3a8a3a; }
        .player-count-bar-medium  { background: #b8960a; }
        .player-count-bar-high    { background: #cc8844; }
        .player-count-bar-full    { background: #cc4444; }

        /* ============================================================
           LOBBY LIST
           ============================================================ */
        .lobby-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .lobby-list-item {
            background: #1e4a1e;
            border: 2px solid #8b6914;
            border-radius: 4px;
            padding: 16px;
        }

        .lobby-list-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .lobby-list-item-card {
            flex: 1;
        }

        .lobby-list-item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        /* ============================================================
           AUTH PAGES — Login, Register, MFA
           ============================================================ */

        /* --- Auth Page Layout --- */
        .auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a3a1a 0%, #0f2a0f 100%);
            padding: 20px;
        }

        .auth-page-inner {
            width: 100%;
            max-width: 420px;
        }

        /* --- Auth Card --- */
        .auth-card {
            background: #1e4a1e;
            border: 2px solid #8b6914;
            border-radius: 6px;
            padding: 32px 28px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: #d4a843;
            text-align: center;
            margin: 0 0 24px 0;
        }

        /* --- Auth Form --- */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
        }

        .auth-label {
            font-size: 12px;
            font-weight: 600;
            color: #7ab87a;
            margin-bottom: 5px;
        }

        .auth-input {
            background: #1a3a1a;
            color: #ffffff;
            border: 2px solid #5a7a3a;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
        }

        .auth-input:focus {
            outline: none;
            border-color: #d4a843;
        }

        .auth-input::placeholder {
            color: #5a7a5a;
        }

        /* --- Password Field --- */
        .auth-password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-password-wrapper .auth-input {
            width: 100%;
            padding-right: 44px;
        }

        .auth-password-toggle {
            position: absolute;
            right: 4px;
            background: none;
            border: none;
            color: #7ab87a;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            line-height: 1;
        }

        .auth-password-toggle:hover {
            color: #d4a843;
        }

        /* --- Submit Button --- */
        .auth-submit-btn {
            background: #8b6914;
            color: #ffffff;
            border: 2px solid #a07a20;
            border-radius: 4px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 4px;
        }

        .auth-submit-btn:hover {
            background: #9a7820;
        }

        .auth-submit-btn:disabled {
            background: #3a3a3a;
            border-color: #555555;
            color: #888888;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* --- Cancel Button --- */
        .auth-cancel-btn {
            background: #3a3a3a;
            color: #cccccc;
            border: 2px solid #555555;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .auth-cancel-btn:hover {
            background: #4a4a4a;
        }

        /* --- Footer Link --- */
        .auth-footer {
            text-align: center;
            margin-top: 20px;
        }

        .auth-link-text {
            font-size: 13px;
            color: #7ab87a;
        }

        .auth-link {
            color: #d4a843;
            text-decoration: underline;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-link:hover {
            color: #e0b850;
        }

        /* --- Error Messages --- */
        .auth-error {
            font-size: 12px;
            color: #cc4444;
            margin-top: 4px;
        }

        .auth-error-banner {
            background: #3a1a1a;
            border: 2px solid #cc4444;
            border-radius: 4px;
            padding: 12px 16px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .auth-error-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* --- Success Messages --- */
        .auth-success {
            background: #1a3a1a;
            border: 2px solid #4a9a4a;
            border-radius: 4px;
            padding: 12px 16px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #7ab87a;
        }

        .auth-success-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .auth-success-text {
            color: #4a9a4a;
        }

        /* --- Field Hints --- */
        .auth-hint {
            font-size: 11px;
            color: #5a7a5a;
            margin-top: 3px;
        }

        /* ============================================================
           MFA INPUT
           ============================================================ */

        .mfa-container {
            text-align: center;
        }

        .mfa-icon {
            font-size: 48px;
            color: #d4a843;
            margin-bottom: 14px;
        }

        .mfa-instruction {
            font-size: 14px;
            color: #7ab87a;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        .mfa-code-input {
            background: #1a3a1a;
            color: #ffffff;
            border: 2px solid #5a7a3a;
            border-radius: 4px;
            padding: 14px 16px;
            font-size: 28px;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            letter-spacing: 8px;
            width: 180px;
            max-width: 100%;
        }

        .mfa-code-input:focus {
            outline: none;
            border-color: #d4a843;
        }

        .mfa-code-input::placeholder {
            color: #3a5a3a;
            letter-spacing: 2px;
            font-size: 16px;
        }

        .mfa-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .lobby-empty {
            text-align: center;
            padding: 40px 20px;
            background: #1e4a1e;
            border: 2px solid #8b6914;
            border-radius: 4px;
        }

        .lobby-empty-icon {
            font-size: 48px;
            color: #d4a843;
            margin-bottom: 14px;
        }

        .lobby-empty-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 8px 0;
        }

        .lobby-empty-text {
            font-size: 14px;
            color: #7ab87a;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="main">
        <p style="padding: 2rem; text-align: center; color: #d4a843; font-family: Segoe UI, sans-serif;">
            Carregando Zero Tilt Poker…
        </p>
    </div>
</body>
</html>
