name: Full Validation (Manual Authorization)

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "Confirma campanha local isolada, até 60 minutos após compilação"
        required: true
        type: choice
        options: ["no", "yes"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gameplay:
    name: Gameplay — catálogo, precisão e integridade
    if: inputs.approved == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FULL_VALIDATION_APPROVED: "1"
      FULL_VALIDATION_MINUTES: "60"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install local WSS test client
        run: npm ci --prefix scripts --ignore-scripts
      - name: Verify runner accounting and stop behaviour
        run: python3 scripts/test_full_validation.py
      - name: Run isolated campaign
        run: bash scripts/full-validation.sh all
      - name: Publish actual results including failed and unexecuted stages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-validation-evidence
          path: artifacts/full-validation
          if-no-files-found: error
