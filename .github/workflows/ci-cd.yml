name: CI/CD Pipeline - Poker Platform

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Job 1: Suíte de Testes Automatizados em Rust (Engine Core & Server) ───
  backend-tests:
    name: 🧪 Run Rust Engine Tests & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Check
        run: cargo check --workspace

      - name: Run All Automated Unit & Integration Tests
        run: cargo test --workspace

      - name: Run SLA Latency Suite (Release Mode)
        run: cargo test --release --test release_latency_suite_test -- --nocapture

  # ─── Job 2: Compilação do Frontend Dioxus para WebAssembly (WASM) ───
  frontend-wasm-build:
    name: 🎨 Build Frontend Dioxus WebAssembly (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain with WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check Frontend WASM Compilation
        run: |
          cd Frontend-Dioxus
          cargo check --target wasm32-unknown-unknown

  # ─── Job 3: Auditoria de Segurança dos Containers & Dependências ───
  security-audit:
    name: 🔒 Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Syntax
        run: docker compose -f Infraestrutura-Docker/docker-compose.yml config
