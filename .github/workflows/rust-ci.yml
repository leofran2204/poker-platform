name: Rust CI

on:
  push:
    branches: [main, master]
    paths:
      - 'Motor-Rust/**'
      - 'Frontend-Web/**'
      - 'API-Axum/**'
      - 'Infraestrutura-Docker/**'
      - 'Documentacao/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/bin/documentation_sync.rs'
      - 'scripts/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Motor-Rust/**'
      - 'Frontend-Web/**'
      - 'API-Axum/**'
      - 'Infraestrutura-Docker/**'
      - 'Documentacao/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/bin/documentation_sync.rs'
      - 'scripts/**'
  workflow_dispatch:  # permite rodar manualmente

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"  # warnings viram erros no CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-sync:
    name: Documentação — sincronização obrigatória
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Verify canonical operational status in every document
        run: cargo run --locked --bin documentation-sync -- --check

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./Motor-Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Motor-Rust/Cargo.lock') }}

      - name: Cargo check
        run: cargo check --workspace

  test:
    name: Motor — testes determinísticos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    defaults:
      run:
        working-directory: ./Motor-Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Motor-Rust/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Motor-Rust/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('Motor-Rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ hashFiles('Motor-Rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-target-

      - name: Run tests
        # A feature `massive-tests` não é habilitada na CI. Testes de carga
        # individuais também permanecem ignored sem essa feature.
        run: cargo test --lib -- --nocapture

  clippy:
    name: Cargo Clippy (Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    defaults:
      run:
        working-directory: ./Motor-Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Motor-Rust/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Cargo Fmt (Format Check)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./Motor-Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  audit:
    name: Cargo Audit (CVE Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./Motor-Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

  dependency-audit:
    name: Supply chain — API e frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        directory: [API-Axum]
    defaults:
      run:
        working-directory: ./${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependency lockfile
        run: cargo audit --deny warnings

  coverage:
    name: Coverage (cargo llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    defaults:
      run:
        working-directory: ./Motor-Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + llvm-tools
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Motor-Rust/target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('Motor-Rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --lib --lcov --output-path ${{ github.workspace }}/Motor-Rust/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motor-rust-coverage
          path: Motor-Rust/lcov.info

      - name: Coverage summary
        run: cargo llvm-cov --lib --summary-only

  frontend-web:
    name: Frontend Web — lockfile, auditoria, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./Frontend-Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend-Web/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Audit npm dependency graph
        run: npm audit --audit-level=high

      - name: TypeScript lint
        run: npm run lint

      - name: Production build
        run: npm run build

  # ─── API Axum (API-Axum) ───

  api-check:
    name: API — Cargo Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./API-Axum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-api-${{ hashFiles('API-Axum/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: API-Axum/target
          key: ${{ runner.os }}-cargo-target-api-${{ hashFiles('API-Axum/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-api-${{ hashFiles('API-Axum/Cargo.lock') }}-
            ${{ runner.os }}-cargo-target-api-

      - name: Cargo check (all targets incl. tests)
        run: cargo check --all-targets

  api-test:
    name: API — testes de contrato e PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: api-check
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: poker_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./API-Axum
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/poker_db
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-api-${{ hashFiles('API-Axum/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: API-Axum/target
          key: ${{ runner.os }}-cargo-target-api-${{ hashFiles('API-Axum/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-api-${{ hashFiles('API-Axum/Cargo.lock') }}-
            ${{ runner.os }}-cargo-target-api-

      - name: Apply PostgreSQL migrations
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=password psql --host localhost --username user --dbname poker_db --file "$migration"
          done

      - name: Run deterministic API tests
        run: >-
          cargo test --lib --bin poker-api --test api_tests --test payments_tests
          --test red_team_simulation_tests -- --nocapture

      - name: Run PostgreSQL contract tests
        run: cargo test --test api_tests -- --ignored --nocapture

      - name: Run PostgreSQL wallet contract tests
        run: cargo test --test payments_tests -- --ignored --nocapture

      - name: Run shared Redis rate-limit contract test
        run: cargo test --test rate_limit_tests -- --ignored --nocapture

  api-clippy:
    name: API — Cargo Clippy (Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: api-check
    defaults:
      run:
        working-directory: ./API-Axum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-api-${{ hashFiles('API-Axum/Cargo.lock') }}

      - name: Run clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

  api-fmt:
    name: API — Cargo Fmt (Format Check)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./API-Axum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  container-security-scan:
    name: DevSecOps — Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner on repo
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  docker-build-validation:
    name: Docker — Build Validation (API + Frontend + Caddy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [api-check, frontend-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate API-Axum Dockerfile builds
        run: docker build -f API-Axum/Dockerfile . --target builder

      - name: Validate Frontend-Web Dockerfile builds
        run: docker build -f Frontend-Web/Dockerfile . --target builder

      - name: Validate Caddyfile syntax
        run: docker run --rm -v ${{ github.workspace }}/Infraestrutura-Docker/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy validate --config /etc/caddy/Caddyfile

  deploy-readiness-gate:
    name: Deploy Readiness Gate ✅
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [documentation-sync, test, coverage, api-test, frontend-web, clippy, api-clippy, fmt, api-fmt, audit, dependency-audit, container-security-scan, docker-build-validation]
    steps:
      - name: All checks passed
        run: |
          echo "============================================="
          echo "🎉 DEPLOY READINESS GATE: ALL CHECKS PASSED"
          echo "============================================="
          echo "Motor-Rust:      ✅ check + test + clippy + fmt + audit + coverage"
          echo "API-Axum:        ✅ check + test + clippy + fmt"
          echo "Frontend-Web:   ✅ audit + lint + production build"
          echo "Security:        ✅ Trivy CVE scan"
          echo "============================================="
