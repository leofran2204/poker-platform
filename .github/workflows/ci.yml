name: Poker Platform CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Motor Rust & API Axum Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Motor-Rust Cargo Check & Tests
        run: |
          cd Motor-Rust
          cargo check --tests
          cargo test --lib -- --nocapture

      - name: API-Axum Cargo Check
        run: |
          cd API-Axum
          cargo check

      - name: Frontend-Dioxus Cargo Check
        run: |
          cd Frontend-Dioxus
          cargo check
