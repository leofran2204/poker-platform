services:
  - type: web
    name: poker-platform-api
    env: docker
    dockerfilePath: ./API-Axum/Dockerfile
    healthCheckPath: /health
    region: oregon
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000