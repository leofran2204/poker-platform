services:
  - type: web
    name: poker-platform-api
    env: docker
    dockerfilePath: ./API-Axum/Dockerfile
    healthCheckPath: /health
    region: oregon
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: PORT
        value: 3000
