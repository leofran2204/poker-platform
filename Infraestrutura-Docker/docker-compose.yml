services:
  # --- Database Layer ---
  postgres:
    image: postgres:15-alpine
    container_name: poker_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: poker_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d poker_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: poker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10



  # --- App Services (Hardened Enterprise Containers) ---
  poker_api:
    build:
      context: ..
      dockerfile: API-Axum/Dockerfile
    container_name: poker_api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/poker_db
      - HOST=0.0.0.0
      - PORT=3000
      - TRUST_PROXY_HEADERS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    # ─── Hardening de Segurança (OWASP Container Security) ───
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  poker_frontend:
    build:
      context: ..
      dockerfile: Frontend-Dioxus/Dockerfile
    container_name: poker_frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - poker_api
    # ─── Hardening de Segurança (OWASP Container Security) ───
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/run:rw,noexec,nosuid
      - /var/cache/caddy:rw,noexec,nosuid
      - /config/caddy:rw,noexec,nosuid
      - /data/caddy:rw,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
