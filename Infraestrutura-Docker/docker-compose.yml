version: '3.8'

services:
  # --- Database Layer ---
  postgres:
    image: postgres:15-alpine
    container_name: poker_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: poker_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: poker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true

  # --- Messaging Layer (Event Bus) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: poker_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    security_opt:
      - no-new-privileges:true

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: poker_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    security_opt:
      - no-new-privileges:true

  # --- App Services (Hardened Enterprise Containers) ---
  poker_api:
    build:
      context: ..
      dockerfile: API-Axum/Dockerfile
    container_name: poker_api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/poker_db
      - JWT_SECRET=test-secret-key-for-poker-platform-2026
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - postgres
      - redis
    # ─── Hardening de Segurança (OWASP Container Security) ───
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  poker_frontend:
    build:
      context: ..
      dockerfile: Frontend-Dioxus/Dockerfile
    container_name: poker_frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - poker_api
    # ─── Hardening de Segurança (OWASP Container Security) ───
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/run:rw,noexec,nosuid
      - /var/cache/caddy:rw,noexec,nosuid
      - /config/caddy:rw,noexec,nosuid
      - /data/caddy:rw,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
