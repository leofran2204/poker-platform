services:
  # --- Database Layer ---
  postgres:
    image: postgres:15-alpine
    container_name: poker_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-poker_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: poker_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- App Services (Hardened Enterprise Containers) ---
  poker_api:
    build:
      context: ..
      dockerfile: API-Axum/Dockerfile
    container_name: poker_api
    env_file:
      - .env
    environment:
      # Compose interpolation: defaults match local lab; staging overrides via .env
      - DATABASE_URL=${DATABASE_URL:-postgres://user:password@postgres:5432/poker_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost}
      - JWT_SECRET=${JWT_SECRET:-dev-only-replace-with-a-random-secret-of-at-least-32-chars}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
      - PIX_PROVIDER=${PIX_PROVIDER:-mock}
      - PIX_MODE=${PIX_MODE:-mock}
      - PIX_WEBHOOK_SECRET=${PIX_WEBHOOK_SECRET:-dev-only-replace-with-a-random-webhook-secret}
      - DEFAULT_BIG_BLIND_CENTS=${DEFAULT_BIG_BLIND_CENTS:-2000}
      - DEFAULT_RAKE_BASIS_POINTS=${DEFAULT_RAKE_BASIS_POINTS:-500}
      - DEFAULT_RAKE_CAP_CENTS=${DEFAULT_RAKE_CAP_CENTS:-10000}
      - LOSS_DEFLATOR_ENABLED=${LOSS_DEFLATOR_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # A API só é acessível pela rede interna do Compose. O Caddy é o único
    # ponto de entrada público e termina TLS antes de encaminhar as requisições.
    # ─── Hardening de Segurança (OWASP Container Security) ───
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  poker_frontend:
    build:
      context: ..
      dockerfile: Frontend-Dioxus/Dockerfile
    container_name: poker_frontend
    environment:
      # Caddyfile usa {$DOMAIN_NAME:localhost} — staging: zerotiltpoker.net
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - poker_api
    # ─── Hardening de Segurança (OWASP Container Security) ───
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/run:rw,noexec,nosuid
      - /var/cache/caddy:rw,noexec,nosuid
      - /config/caddy:rw,noexec,nosuid
      - /data/caddy:rw,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
