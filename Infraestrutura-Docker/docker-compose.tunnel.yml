# Overlay: Caddy em HTTP (TLS na Cloudflare). Não tenta Let's Encrypt.
#
#   cd Infraestrutura-Docker
#   copy .env.tunnel.example .env
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# cloudflared no host:
#   zerotiltpoker.net → http://127.0.0.1:80
#
# Nota: o compose base ainda publica 80 (e 443). Com Caddyfile.tunnel o Caddy
# só escuta HTTP/80; a 443 pode ficar ociosa. Em casa, se a porta 80 do PC
# não estiver redirecionada no roteador, a internet não entra — só o tunnel.

services:
  poker_frontend:
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
