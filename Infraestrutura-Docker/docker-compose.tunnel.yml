# Overlay: origem HTTPS (Caddy + cert Origin CA) para Cloudflare Tunnel.
#
#   1) Gere certs (ver DEPLOY_HOME_CLOUDFLARE.md) em ./certs/
#   2) copy .env.tunnel.example .env
#   3) docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# cloudflared → https://127.0.0.1:443
# Cloudflare SSL/TLS mode: Full (strict) com Origin CA

services:
  poker_frontend:
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
      - ./certs/origin.pem:/etc/caddy/certs/origin.pem:ro
      - ./certs/origin-key.pem:/etc/caddy/certs/origin-key.pem:ro
