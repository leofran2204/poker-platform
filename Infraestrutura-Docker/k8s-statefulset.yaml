apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: poker-game-server
  namespace: poker-platform
  labels:
    app: poker-game-server
spec:
  serviceName: "poker-game-service"
  # TableActor ainda é local ao processo; escalar antes de introduzir
  # ownership distribuído dividiria uma mesa entre pods.
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: poker-game-server
  template:
    metadata:
      labels:
        app: poker-game-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: poker-api
          image: poker-platform/poker-api:latest
          ports:
            - containerPort: 3000
              name: api-internal
          env:
            - name: ENVIRONMENT
              value: production
            - name: TRUST_PROXY_HEADERS
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: poker-platform-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: poker-platform-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: poker-platform-secrets
                  key: jwt-secret
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: poker-platform-secrets
                  key: cors-origins
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: api-internal
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api-internal
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: poker-game-service
  namespace: poker-platform
spec:
  type: ClusterIP
  selector:
    app: poker-game-server
  ports:
    - name: api-internal
      port: 3000
      targetPort: api-internal
