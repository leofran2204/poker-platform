apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: poker-game-server
  namespace: poker-platform
  labels:
    app: poker-game-server
spec:
  serviceName: "poker-game-service"
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: poker-game-server
  template:
    metadata:
      labels:
        app: poker-game-server
    spec:
      containers:
        - name: poker-engine
          image: poker-platform/poker-engine:latest
          ports:
            - containerPort: 8080
              name: websocket
            - containerPort: 9090
              name: metrics
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_URL
              value: "redis://redis-cluster.poker-platform.svc.cluster.local:6379"
            - name: DATABASE_URL
              value: "postgres://poker_user:secret@postgres-cluster:5432/poker_db"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: poker-game-service
  namespace: poker-platform
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: poker-game-server
  ports:
    - name: websocket
      port: 8080
      targetPort: 8080
