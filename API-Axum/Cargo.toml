[package]
name = "poker-api"
version = "0.1.0"
edition = "2021"

[features]
# Perfis de carga executados apenas pela rotina manual autorizada. O custo
# reduzido de bcrypt vale exclusivamente para o binário de teste da API.
full-validation = ["poker-engine/test-fast-bcrypt"]

[dependencies]
# ── Motor (workspace path dependency) ──
poker-engine = { path = "../Motor-Rust" }

# ── Web framework ──
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"

# ── Database ──
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
redis = { version = "0.25", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Utilities ──
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
subtle = "2.6"

[dev-dependencies]
# Test utilities for tower services (oneshot, ready, etc.)
tower = { version = "0.5", features = ["util"] }
# Utilities for reading API response bodies in tests
http-body-util = "0.1"
# RFC 6238 contract vectors for the MFA integration test.
sha1 = "0.10"
# Property-based fuzz testing
proptest = "1.5"

[[test]]
name = "api_fuzz_tests"
path = "tests/api_fuzz_tests.rs"
required-features = ["full-validation"]

[[test]]
name = "ws_stress_tests"
path = "tests/ws_stress_tests.rs"
required-features = ["full-validation"]

[[test]]
name = "ws_network_jitter_tests"
path = "tests/ws_network_jitter_tests.rs"
required-features = ["full-validation"]

[[test]]
name = "concurrency_ws_tests"
path = "tests/concurrency_ws_tests.rs"
required-features = ["full-validation"]

[[test]]
name = "actor_disconnect_stress_tests"
path = "tests/actor_disconnect_stress_tests.rs"
required-features = ["full-validation"]

[[test]]
name = "db_pool_stress_tests"
path = "tests/db_pool_stress_tests.rs"
required-features = ["full-validation"]
