[package]
name = "poker-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# ── Motor (workspace path dependency) ──
poker-engine = { path = "../Motor-Rust" }

# ── Web framework ──
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"

# ── Database ──
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
redis = { version = "0.25", default-features = false, features = ["tokio-comp", "aio", "std"] }

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Utilities ──
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# Test utilities for tower services (oneshot, ready, etc.)
tower = { version = "0.5", features = ["util"] }
# Utilities for reading HTTP body in tests
http-body-util = "0.1"
# Property-based fuzz testing
proptest = "1.5"
