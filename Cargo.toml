[package]
name = "poker-tooling"
version = "0.1.0"
edition = "2021"
authors = ["Poker Platform Team"]
description = "Ferramentas do monorepo Zero Tilt Poker (sincronização de documentação). O motor canônico vive em Motor-Rust; o engine legado foi arquivado em legacy/engine-v1."

[[bin]]
name = "documentation-sync"
path = "src/bin/documentation_sync.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
