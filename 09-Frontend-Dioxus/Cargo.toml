[package]
name = "poker-frontend"
version = "0.1.0"
edition = "2024"
description = "Poker Project - Front-end WebAssembly com Dioxus"

[dependencies]
dioxus = { version = "0.6", features = ["web", "logger", "devtools"] }
dioxus-logger = "0.6"
dioxus-router = "0.6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["websocket"] }
futures-channel = "0.3"
futures-util = "0.3"
ws_stream_wasm = "0.7"
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[features]
default = ["web"]
web = ["dioxus/web"]
